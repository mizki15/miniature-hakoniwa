<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakoniwa — 技術検証 P0</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="layout">
      <!-- 左：生き物図鑑（レイアウトのみ） -->
      <aside id="left" class="side glass">
        <header>
          <span>生き物図鑑</span>
          <button class="collapse" data-target="left" title="たたむ">‹</button>
        </header>
        <div class="side-body">
          <div class="tabs"><span class="tab on">動物</span><span class="tab">植物</span><span class="tab">魚・虫</span></div>
          <div class="dex-grid" id="dexGrid"></div>
          <div id="dexDetail">カードを選ぶと説明が出ます</div>
          <div class="placeholder-note">（仮の登録：植物・魚・虫は準備中）</div>
        </div>
      </aside>

      <!-- 左：エディタ（エディタモードのみ） -->
      <aside id="editor" class="side glass">
        <header><span>エディタ</span></header>
        <div class="side-body">
          <div id="tools" class="tool-list"></div>
          <div id="seedBox">
            <h3>種</h3>
            <div id="seeds" class="seed-list"></div>
          </div>
          <div id="toolHint" class="tool-hint"></div>
          <div class="howto">
            <div><b>左ドラッグ</b>：なぞった所にまとめて使う</div>
            <div><b>右ドラッグ</b>：回転　<b>ホイール</b>：ズーム</div>
            <div><b>中ドラッグ</b>：移動　<b>Esc</b>：見るモードへ</div>
          </div>
        </div>
      </aside>

      <!-- 中央：箱庭 -->
      <main id="stage">
        <div id="app"></div>
        <button class="reopen glass" id="reopen-left" data-target="left" title="図鑑をひらく">›</button>
        <button class="reopen glass" id="reopen-right" data-target="right" title="ステータスをひらく">‹</button>

        <!-- デバッグウィンドウ -->
        <div id="ui" class="glass">
          <div class="title" id="uiTitle" title="クリックでたたむ／ひらく">Hakoniwa <small>デバッグ</small><span class="fold">▾</span></div>
          <div class="row">
            <button id="rotL" title="左に90°回転">⟲ 90°</button>
            <button id="rotR" title="右に90°回転">90° ⟳</button>
            <button id="auto">自動周回</button>
          </div>
          <div class="row">
            <label>時刻 <input type="range" id="time" min="0" max="24" step="0.05" /></label>
            <span id="timeLabel"></span>
            <button id="now">現在</button>
          </div>
          <div class="row">
            <label>季節
              <select id="season">
                <option value="auto">暦どおり</option>
                <option value="0">春</option>
                <option value="1">夏</option>
                <option value="2">秋</option>
                <option value="3">冬</option>
              </select>
            </label>
            <span id="seasonLabel"></span>
          </div>
          <div class="row">
            <label>天気
              <select id="weather">
                <option value="auto">自動</option>
                <option value="clear">晴れ</option>
                <option value="cloudy">くもり</option>
                <option value="rain">雨</option>
                <option value="snow">雪</option>
              </select>
            </label>
            <span id="weatherLabel"></span>
            <button id="meteor" title="流れ星を流す（夜のみ見える）">流れ星</button>
          </div>
          <div class="row">
            <label><input type="checkbox" id="round" checked /> 角丸</label>
            <label>境界のなじみ <input type="range" id="blend" min="0" max="1" step="0.05" value="0.8" /></label>
          </div>
          <div class="row">
            <label>画質
              <select id="quality">
                <option value="auto" selected>自動</option>
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
              </select>
            </label>
            <span id="qualityLabel"></span>
            <button id="sound" title="環境音（風・水・鳥・虫・雨）">🔈 環境音</button>
          </div>
          <div class="row">
            <label><input type="checkbox" id="bloom" checked /> ブルーム</label>
            <label><input type="checkbox" id="ssao" checked /> AO</label>
            <label>強さ <input type="range" id="aoStrength" min="0" max="1.5" step="0.05" value="1" /></label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="dof" checked /> 被写界深度</label>
            <label>f値 <input type="range" id="fstop" min="0" max="8" step="1" value="4" /></label>
            <span id="fLabel"></span>
          </div>
          <div class="row">
            <label>サイズ
              <select id="size">
                <option value="64">64</option>
                <option value="128" selected>128</option>
                <option value="192">192</option>
                <option value="256">256</option>
                <option value="384">384</option>
              </select>
            </label>
            <label>小物
              <select id="detail" title="木や花のボクセルの細かさ（地面に対する比）">
                <option value="1">1/1</option>
                <option value="3" selected>1/3</option>
                <option value="4">1/4</option>
              </select>
            </label>
            <label>花
              <select id="flowerStyle">
                <option value="lowpoly" selected>ローポリ</option>
                <option value="voxel">ボクセル</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>シード <input id="seed" type="number" value="1234" /></label>
            <button id="regen">生成</button>
          </div>
          <details class="params">
            <summary>地形のパラメータ</summary>
            <div class="param"><label for="p-relief">起伏の激しさ</label><input type="range" id="p-relief" min="0" max="2.5" step="0.1" value="1" /><output></output></div>
            <div class="param"><label for="p-mountains">山の高さ</label><input type="range" id="p-mountains" min="0" max="2.5" step="0.1" value="1" /><output></output></div>
            <div class="param"><label for="p-water">水の多さ</label><input type="range" id="p-water" min="0" max="2" step="0.1" value="1" /><output></output></div>
            <div class="param"><label for="p-rocks">岩場の多さ</label><input type="range" id="p-rocks" min="0" max="2" step="0.1" value="1" /><output></output></div>
            <div class="param"><label for="p-forest">森の密度</label><input type="range" id="p-forest" min="0" max="3" step="0.1" value="1" /><output></output></div>
            <div class="param"><label for="p-flowers">花の密度</label><input type="range" id="p-flowers" min="0" max="3" step="0.1" value="1" /><output></output></div>
            <div class="row"><button id="paramsReset">標準に戻す</button><span class="hint">変更後「生成」で反映</span></div>
          </details>
          <div class="row">
            <label>時間の流れ
              <select id="simSpeed" title="畑や苗木の育つ速さ（テスト用の早送り）">
                <option value="1" selected>×1（現実と同じ）</option>
                <option value="60">×60</option>
                <option value="600">×600</option>
              </select>
            </label>
            <button id="skip1">+1時間</button>
            <button id="skip6">+6時間</button>
          </div>
          <div id="stats"></div>
        </div>

        <!-- モード切り替え（画面下中央） -->
        <div id="modes" class="glass">
          <button data-mode="view"><span class="ic">👁</span>見る<span class="k">V</span></button>
          <button data-mode="edit"><span class="ic">🛠</span>エディタ<span class="k">E</span></button>
        </div>
        <div id="toast"></div>
        <!-- ステータスモード：ホバーした物の情報 -->
        <div id="tooltip" class="glass"></div>
      </main>

      <!-- 右：ステータス（一部はまだレイアウトのみ） -->
      <aside id="right" class="side glass">
        <header>
          <button class="collapse" data-target="right" title="たたむ">›</button>
          <span>ステータス</span>
        </header>
        <div class="side-body">
          <section class="stat-block">
            <h3>箱庭</h3>
            <dl>
              <dt>時刻</dt><dd id="st-time">—</dd>
              <dt>季節</dt><dd id="st-season">—</dd>
              <dt>天気</dt><dd id="st-weather">—</dd>
            </dl>
          </section>
          <section class="stat-block">
            <h3>住人</h3>
            <dl id="st-residents"></dl>
          </section>
          <section class="stat-block">
            <h3>畑・素材</h3>
            <dl id="st-farm"></dl>
            <h3 class="sub-h">持ち物</h3>
            <dl id="st-inv"></dl>
          </section>
          <section class="stat-block">
            <h3>できごと</h3>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </section>
          <div class="placeholder-note">（準備中）</div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
